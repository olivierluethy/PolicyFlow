# ---------------------------------------------------------------------------
# PolicyFlow application configuration
# ---------------------------------------------------------------------------

quarkus.application.name=policyflow

# --- Datasource (PostgreSQL) ----------------------------------------------
quarkus.datasource.db-kind=postgresql
# Credentials/URL are only set for dev & prod; under %test the Quarkus Dev
# Services start a throwaway PostgreSQL container automatically.
%dev.quarkus.datasource.username=policyflow
%dev.quarkus.datasource.password=policyflow123
# Dev connects to the docker-compose PostgreSQL, which is published on host port 5433.
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/policyflowdb
%prod.quarkus.datasource.username=policyflow
%prod.quarkus.datasource.password=policyflow123
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/policyflowdb

# --- Hibernate / Flyway ----------------------------------------------------
# The schema is owned by Flyway, so Hibernate never generates DDL.
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# --- HTTP / CORS -----------------------------------------------------------
quarkus.http.port=8080
# Dev mode listens on 8090 to avoid clashing with another local app on 8080.
%dev.quarkus.http.port=8090
# Use a random free port during tests so concurrent local apps don't clash.
%test.quarkus.http.test-port=0
%test.quarkus.http.port=0
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type

# --- OpenAPI / Swagger UI --------------------------------------------------
quarkus.smallrye-openapi.path=/api/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger

# --- JWT (SmallRye) --------------------------------------------------------
mp.jwt.verify.issuer=https://policyflow.ch
mp.jwt.verify.publickey.location=publicKey.pem
smallrye.jwt.sign.key.location=privateKey.pem

# --- Logging ---------------------------------------------------------------
quarkus.log.level=INFO
quarkus.log.category."ch.policyflow".level=DEBUG
