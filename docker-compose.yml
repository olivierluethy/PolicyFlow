services:
  postgres:
    image: postgres:16
    container_name: policyflow-db
    environment:
      POSTGRES_DB: policyflowdb
      POSTGRES_USER: policyflow
      POSTGRES_PASSWORD: policyflow123
    ports:
      - "5433:5432"
    volumes:
      - policyflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policyflow -d policyflowdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: policyflow-app
    ports:
      - "8090:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/policyflowdb
      QUARKUS_DATASOURCE_USERNAME: policyflow
      QUARKUS_DATASOURCE_PASSWORD: policyflow123

volumes:
  policyflow_data:
